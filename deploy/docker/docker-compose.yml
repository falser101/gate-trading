version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gate_trading_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gate_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gate_trading_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: gate_trading_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - APP_SECRET=${APP_SECRET:-change-me-in-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=gate_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATE_API_KEY=${GATE_API_KEY}
      - GATE_API_SECRET=${GATE_API_SECRET}
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: gate_trading_worker
    depends_on:
      - postgres
      - redis
      - api
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=gate_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATE_API_BASE_URL=https://api.gateio.ws/api/v4
    command: ["./worker"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
